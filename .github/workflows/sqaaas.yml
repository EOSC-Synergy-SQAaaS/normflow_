name: SQAaaS-Test

on: [push]

jobs:
   sqaaas_job:
     runs-on: ubuntu-latest
     name: Job that triggers SQAaaS platform
     steps:
       - name: SQAaaS pytest step
         uses: eosc-synergy/sqaaas-step-action@v1
         with:
            name: pytest-step
            container: pytorch/pytorch
            tool: commands
            commands: |
               pip install pytest
               pytest -sv
       - name: SQAaaS assessment step
         uses: eosc-synergy/sqaaas-assessment-action@v2
         with:
            qc_uni_steps: pytest-step
